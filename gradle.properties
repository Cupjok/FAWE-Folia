group=com.fastasyncworldedit

# Gradle reads the DOS timestamps in older dependency jars through a locale-default Calendar, so on a Thai
# locale every one of them comes back 543 years early - far enough back that repacking them fails outright.
org.gradle.jvmargs=-Xmx1512M -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.caching=true

loom_fabric_repository=https://maven.enginehub.org/artifactory/fabricmc/
loom_libraries_base=https://maven.enginehub.org/artifactory/minecraft/

